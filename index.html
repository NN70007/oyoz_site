<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oyoz</title>
<meta name="description" content="Oyoz">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">

<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20261111b">
<style>
  :root{--fond:#fff;--doux:#7A818C}

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--fond);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;min-height:100vh}

<main>
  <h1><picture>
    <source srcset="assets/oyoz-logo-sombre.svg?v=20261111b" media="(prefers-color-scheme: dark)">
    <img src="assets/oyoz-logo.svg?v=20261111b" alt="Oyoz" width="300" height="104">
  </picture></h1>
</main>
<footer>© 2026 Oyoz</footer>
<script>(function(){var l=(navigator.language||'fr').slice(0,2).toLowerCase();document.documentElement.lang=(l==='fr')?'fr':'en';})();</script>
